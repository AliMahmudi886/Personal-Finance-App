{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block main_class %} account-main{% endblock %}
{% block content %}
<section class="surface account-panel" aria-labelledby="entry-heading">
    <header class="account-heading">
        <h1 id="entry-heading">{{ heading }}</h1>
        <p>{{ description }}</p>
    </header>
    <form class="account-form" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% block fields %}{% endblock %}
        <div class="actions entry-actions">
            <button class="ds-button primary" type="submit">{{ submit_label }}</button>
            <a class="ds-button" href="{{ url_for(cancel_endpoint) }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
