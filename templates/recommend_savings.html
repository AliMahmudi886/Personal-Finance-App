{% extends "base.html" %}

{% block title %}Spending Reference{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="text-center mb-4">Spending Reference</h2>
                    {% if latest is not none %}
                        <div class="alert alert-info text-center" role="alert">
                            Most recent recorded expense: <strong>${{ "%.2f"|format(latest[1]) }}</strong> on {{ latest[0] }}.
                        </div>
                    {% else %}
                        <div class="alert alert-warning text-center" role="alert">
                            Record an expense to see it here.
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
