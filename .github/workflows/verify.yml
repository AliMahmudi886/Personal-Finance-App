name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    env:
      FINANCE_TEST_ML: '1'
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check app.py ml_model.py models.py overview.py forecast.py app/init.py tests
      - run: ruff format --check app.py ml_model.py models.py overview.py forecast.py app/init.py tests
      - run: python -m compileall -q app.py ml_model.py models.py overview.py forecast.py app tests
      - run: python -m unittest discover -s tests -v
      - run: python -m pip_audit --strict -r requirements.txt
